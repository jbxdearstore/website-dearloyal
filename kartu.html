<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kartu saya | DearLoyal</title>
<link rel="stylesheet" href="/css/dl.css">
</head>
<body>
<div class="hal">
  <div class="atas">
    <h1 class="merek">DearLoyal</h1>
      <div style="display:flex;gap:8px;align-items:center">
      <span class="slot-lonceng"></span>
      <a href="/profil" class="tombol putih kecil" style="text-decoration:none">Profil</a>
      <button type="button" id="keluar" class="tombol putih kecil">Keluar</button>
        </div>
  </div>

  <div class="kartu-profil">
    <h2 id="nama">...</h2>
    <div class="redup">@<span id="username"></span></div>
    <div class="id" id="idunik"></div>
    <div class="redup">ID pembeli</div>
  </div>

    <div class="qr-kotak">
    <div id="qr"></div>
    <div class="redup">Tunjukkan QR ini ke kasir</div>
    <button type="button" id="simpanQr" class="tombol putih kecil">Simpan QR sebagai gambar</button>
    </div>
  <div id="daftar" class="daftar"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script src="/js/app.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/lonceng.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="/js/qr.js"></script>
<script>
const el = id => document.getElementById(id);

(async () => {
  const { data } = await db.auth.getSession();
  if (!data.session) return location.replace('/masuk');

  const { data: profil, error } = await db
    .from('profiles')
    .select('nama, username, id_unik, peran')
    .eq('id', data.session.user.id)
    .single();

  if (error || !profil) {
    el('nama').textContent = 'Profil belum tersedia';
    return;
  }
  if (profil.peran === 'admin') return location.replace('/admin');
  if (profil.peran === 'owner') return location.replace('/owner');
  el('nama').textContent = profil.nama;
  el('username').textContent = profil.username;
  el('idunik').textContent = profil.id_unik.slice(0, 4) + ' ' + profil.id_unik.slice(4);
  const m = matriksQr(location.origin + '/c/' + profil.id_unik);
  el('qr').innerHTML = svgQr(m);
  el('simpanQr').onclick = () => unduhQr(m, 'qr-dearloyal-' + profil.id_unik + '.png');
    const { data: daftar } = await db.rpc('kartu_saya');
  const box = el('daftar');
  if (!daftar || daftar.length === 0) {
    box.innerHTML = '<div class="kosong">Belum ada kartu. Scan QR di kasir toko untuk bergabung.</div>';
  } else {
    box.innerHTML = daftar.map(htmlKartu).join('');
  }
})();

el('keluar').onclick = async () => {
  await db.auth.signOut();
  location.replace('/masuk');
};
</script>
</body>
</html>
