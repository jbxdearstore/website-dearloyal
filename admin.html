<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin | DearLoyal</title>
<link rel="stylesheet" href="/css/dl.css">
</head>
<body>
<div id="app"><div class="tengah"><div class="panel pusat">Memuat...</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/app.js"></script>
<script src="/js/ui.js"></script>
<script>
const el = id => document.getElementById(id);
const app = el('app');
const LABEL = { menunggu: 'Menunggu', aktif: 'Aktif', nonaktif: 'Nonaktif', ditolak: 'Ditolak', dihapus: 'Sampah' };
const FILTER = ['semua', 'menunggu', 'aktif', 'nonaktif', 'ditolak', 'dihapus', 'pulihkan'];
let semua = [], filter = 'semua';

function tolakAkses(email) {
  app.innerHTML = '<div class="tengah"><div class="panel pusat">' +
    '<div class="ikon-besar">🔒</div>' +
    '<h1 class="merek" style="color:var(--teks)">Tidak diizinkan</h1>' +
    '<p class="sub">Halaman ini khusus admin.<br>Kamu masuk sebagai: <strong>' + esc(email || '-') + '</strong></p>' +
    '<div class="aksi"><button type="button" id="keluar" class="tombol">Keluar dan ganti akun</button>' +
    '<a class="tombol putih" href="/">Kembali ke beranda</a></div></div></div>';
}

function linkWa(n) {
  let d = String(n || '').replace(/[^0-9]/g, '');
  if (d.startsWith('0')) d = '62' + d.slice(1);
  return d ? 'https://wa.me/' + d : '';
}
function tanggal(s) {
  return new Date(s).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
}
function sisaHari(s) {
  return Math.max(0, 30 - Math.floor((Date.now() - new Date(s).getTime()) / 86400000));
}
function kepala() {
  return '<div class="atas"><div><h1 class="merek">DearLoyal</h1><div class="redup">Panel admin</div></div>' +
    '<button type="button" id="keluar" class="tombol putih kecil">Keluar</button></div>';
}
function hitungStatus() {
  const h = {};
  FILTER.forEach(f => { h[f] = 0; });
  semua.forEach(t => {
    h[t.status] = (h[t.status] || 0) + 1;
    if (t.status !== 'dihapus') h.semua++;
  });
  return h;
}
function chipsHtml() {
  const h = hitungStatus();
  return '<div class="chips">' + FILTER.map(f => {
    const nama = f === 'semua' ? 'Semua' : f === 'pulihkan' ? 'Pulihkan' : LABEL[f];
    const n = f === 'pulihkan' ? '' : ' (' + h[f] + ')';
    return '<button type="button" class="chip' + (f === filter ? ' aktif' : '') +
      '" data-filter="' + f + '">' + nama + n + '</button>';
  }).join('') + '</div>';
}

function render() {
  if (filter === 'pulihkan') return renderPulihkan();
  const daftar = filter === 'semua'
    ? semua.filter(t => t.status !== 'dihapus')
    : semua.filter(t => t.status === filter);

  const kartu = daftar.map(t => {
    let aksi = '';
    if (t.status === 'menunggu') {
      aksi = '<button type="button" class="tombol hijau" data-aksi="terima" data-id="' + t.id + '">Terima</button>' +
             '<button type="button" class="tombol merah" data-aksi="tolak" data-id="' + t.id + '">Tolak</button>' +
             '<button type="button" class="tombol merah" data-aksi="tolak_blokir" data-id="' + t.id + '">Tolak dan blokir</button>';
    } else if (t.status === 'aktif') {
      aksi = '<button type="button" class="tombol putih" data-aksi="unduh" data-id="' + t.id + '">Unduh data</button>' +
             '<button type="button" class="tombol merah" data-aksi="nonaktifkan" data-id="' + t.id + '">Nonaktifkan</button>' +
             '<button type="button" class="tombol merah" data-aksi="hapus" data-id="' + t.id + '">Hapus toko</button>';
    } else if (t.status === 'nonaktif') {
      aksi = '<button type="button" class="tombol hijau" data-aksi="aktifkan" data-id="' + t.id + '">Aktifkan</button>' +
             '<button type="button" class="tombol putih" data-aksi="unduh" data-id="' + t.id + '">Unduh data</button>' +
             '<button type="button" class="tombol merah" data-aksi="hapus" data-id="' + t.id + '">Hapus toko</button>';
    } else if (t.status === 'dihapus') {
      aksi = '<button type="button" class="tombol putih" data-aksi="unduh" data-id="' + t.id + '">Unduh data</button>' +
             '<button type="button" class="tombol merah" data-aksi="permanen" data-id="' + t.id + '">Hapus permanen</button>';
    }
    const wa = linkWa(t.whatsapp);
    return '<div class="tk">' +
      '<div style="display:flex;justify-content:space-between;gap:8px;align-items:start">' +
        '<h3>' + esc(t.nama) + '</h3><span class="badge ' + esc(t.status) + '">' + esc(LABEL[t.status] || t.status) + '</span></div>' +
      '<div class="meta">/t/' + esc(t.slug) + '</div>' +
      '<div class="meta">' + esc(t.jenis_usaha || '-') + ' · ' + esc(t.kota || '-') + ' · ' + t.jumlah_member + ' member</div>' +
      '<div class="meta">Owner: ' + esc(t.owner_nama) + ' (' + esc(t.owner_email || '-') + ')' +
        (t.owner_diblokir ? ' · <strong style="color:var(--merah)">diblokir</strong>' : '') + '</div>' +
      '<div class="meta">Daftar: ' + tanggal(t.dibuat_pada) + '</div>' +
      (t.status === 'dihapus' && t.dihapus_pada
        ? '<div class="meta" style="color:var(--merah)">Dihapus ' + tanggal(t.dihapus_pada) +
          ' · dihapus permanen otomatis dalam ' + sisaHari(t.dihapus_pada) + ' hari</div>' : '') +
      (wa ? '<div class="meta"><a href="' + wa + '" target="_blank" rel="noopener">Hubungi WhatsApp</a></div>' : '') +
      (t.alasan_internal ? '<div class="meta">Alasan nonaktif: ' + esc(t.alasan_internal) + '</div>' : '') +
      (t.alasan_tolak ? '<div class="meta">Alasan tolak: ' + esc(t.alasan_tolak) + '</div>' : '') +
      (aksi ? '<div class="aksi">' + aksi + '</div>' : '') + '</div>';
  }).join('');

  app.innerHTML = '<div class="hal lebar">' + kepala() + chipsHtml() +
    (daftar.length ? '<div class="grid-tk">' + kartu + '</div>'
                   : '<div class="kosong">Belum ada toko di kategori ini.</div>') + '</div>';
}

function renderPulihkan() {
  app.innerHTML = '<div class="hal lebar">' + kepala() + chipsHtml() +
    '<div class="sec" style="margin-top:0"><h3>Pulihkan toko dari ZIP</h3>' +
    '<p class="sub" style="margin-top:0">Hanya atas persetujuan admin, setelah owner meminta. ' +
    'Pilih file ZIP yang dibuat dari tombol Unduh data, lalu tekan Aktifkan.</p>' +
    '<div class="dropzona"><input type="file" id="fileZip" accept=".zip,application/zip"></div>' +
    '<div class="aksi" style="margin-top:12px"><button type="button" id="bPulih" class="tombol hijau">Aktifkan</button></div>' +
    '<div id="pesanPulih" class="pesan"></div></div></div>';
}

async function ambil() {
  const { data, error } = await db.rpc('admin_daftar_toko');
  if (error) throw error;
  semua = data || [];
}
async function muat() {
  try { await ambil(); }
  catch (error) {
    app.innerHTML = '<div class="tengah"><div class="panel pusat"><p class="sub">Gagal memuat: ' +
      esc(error.message) + '</p></div></div>';
    return;
  }
  render();
}

/* ---------- ZIP data toko ---------- */
function unduhBlob(blob, nama) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nama;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

async function buatZip(t) {
  const { data, error } = await db.rpc('admin_ekspor_toko', { p_toko_id: t.id });
  if (error) throw error;
  const zip = new JSZip();
  zip.file('data.json', JSON.stringify(data));
  zip.file('BACA-SAYA.txt',
    'Data toko "' + t.nama + '" dari DearLoyal.\n' +
    'Jangan ubah isi file ini. File yang diubah tidak bisa dipakai untuk memulihkan toko.\n' +
    'Untuk memulihkan toko, serahkan file ZIP ini kepada admin DearLoyal.\n');
  const lp = data.toko && data.toko.logo_path;
  if (lp) {
    try {
      const r = await fetch(urlLogo(lp));
      if (r.ok) zip.file('logo/' + lp.split('/').pop(), await r.blob());
    } catch (e) { /* logo tidak wajib */ }
  }
  const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
  unduhBlob(blob, t.slug + '-' + new Date().toISOString().slice(0, 10) + '.zip');
}

async function unduhData(t) {
  try { await buatZip(t); alert('ZIP data toko sudah dibuat dan diunduh.'); }
  catch (e) { alert('Gagal membuat ZIP: ' + (e.message || e)); }
}

async function hapusToko(t) {
  const alasan = prompt('Alasan menghapus toko "' + t.nama + '" (opsional, catatan internal):');
  if (alasan === null) return;
  if (!confirm('Langkah 1 dari 3: ZIP data toko akan dibuat dan diunduh. Lanjutkan?')) return;
  try { await buatZip(t); }
  catch (e) { return alert('Gagal membuat ZIP: ' + (e.message || e) + '\nPenghapusan dibatalkan.'); }
  if (!confirm('Langkah 2 dari 3: Apakah file ZIP sudah ada di perangkat ini? Pastikan sebelum lanjut.')) return;
  const nama = prompt('Langkah 3 dari 3: ketik nama toko persis untuk menghapus:\n' + t.nama);
  if (nama === null) return;
  const { error } = await db.rpc('admin_hapus_toko', { p_toko_id: t.id, p_nama: nama, p_alasan: alasan });
  if (error) return alert(error.message);
  await muat();
}

async function hapusPermanen(t) {
  if (!confirm('Hapus PERMANEN toko "' + t.nama + '"? Setelah ini data hanya bisa dipulihkan dari file ZIP.')) return;
  const nama = prompt('Ketik nama toko persis untuk menghapus permanen:\n' + t.nama);
  if (nama === null) return;
  const { error } = await db.rpc('admin_hapus_permanen', { p_toko_id: t.id, p_nama: nama });
  if (error) return alert(error.message);
  await muat();
}

async function pulihkan() {
  const p = el('pesanPulih');
  const info = (teks, j) => { p.textContent = teks; p.className = 'pesan tampil ' + j; };
  const f = el('fileZip').files[0];
  if (!f) return info('Pilih file ZIP dulu.', 'galat');
  if (f.size > 20 * 1024 * 1024) return info('File terlalu besar.', 'galat');
  el('bPulih').disabled = true;
  try {
    info('Membaca file...', 'ok');
    const zip = await JSZip.loadAsync(f);
    const berkas = zip.file('data.json');
    if (!berkas) throw new Error('File ZIP bukan data DearLoyal.');
    const data = JSON.parse(await berkas.async('string'));

    let slugBaru = null, hasil = null;
    for (let i = 0; i < 2; i++) {
      info('Memulihkan toko, mohon tunggu...', 'ok');
      const { data: h, error } = await db.rpc('admin_pulihkan_toko',
        { p_data: data, p_slug_baru: slugBaru });
      if (!error) { hasil = h; break; }
      if (i === 0 && error.message.includes('sudah dipakai')) {
        slugBaru = prompt('Link toko lama sudah dipakai. Isi link baru (huruf kecil, angka, strip):');
        if (!slugBaru) throw new Error('Dibatalkan.');
        continue;
      }
      throw error;
    }

    let catatan = '';
    const lp = data.toko && data.toko.logo_path;
    if (lp) {
      const fl = zip.file(/^logo\//)[0];
      if (fl) {
        const blob = await fl.async('blob');
        const tipe = /\.webp$/i.test(lp) ? 'image/webp' : /\.png$/i.test(lp) ? 'image/png' : 'image/jpeg';
        const { error: e2 } = await db.storage.from('logo').upload(lp, blob, { upsert: true, contentType: tipe });
        if (e2) catatan = ' Logo gagal dipulihkan, owner bisa mengunggah ulang dari dashboard.';
      } else {
        catatan = ' Logo tidak ada di ZIP, owner bisa mengunggah ulang.';
      }
    }
    info('Toko dipulihkan: /t/' + hasil.slug + ' (' + hasil.status + '). Kartu: ' + hasil.kartu_dipulihkan +
      ', dilewati: ' + hasil.kartu_dilewati + ', stempel: ' + hasil.stempel + ', klaim: ' + hasil.klaim + '.' + catatan, 'ok');
    try { await ambil(); } catch (e) {}
  } catch (e) {
    info(e.message || 'Gagal memulihkan toko.', 'galat');
  } finally {
    const b = el('bPulih');
    if (b) b.disabled = false;
  }
}

/* ---------- aksi status ---------- */
async function aksi(id, a) {
  let alasan = null, blokir = false;
  if (a === 'tolak' || a === 'tolak_blokir') {
    if (a === 'tolak_blokir' &&
        !confirm('Akun owner ini tidak akan bisa mendaftar toko lagi. Lanjutkan?')) return;
    alasan = prompt('Alasan penolakan (opsional, terlihat oleh owner):');
    if (alasan === null) return;
    blokir = a === 'tolak_blokir';
    a = 'tolak';
  } else if (a === 'nonaktifkan') {
    alasan = prompt('Alasan menonaktifkan (catatan internal, tidak tampil ke publik):');
    if (alasan === null) return;
  } else if (a === 'terima') {
    if (!confirm('Terima toko ini?')) return;
  } else if (a === 'aktifkan') {
    if (!confirm('Aktifkan kembali toko ini?')) return;
  }
  const { error } = await db.rpc('admin_ubah_status', {
    p_toko_id: id, p_aksi: a, p_alasan: alasan, p_blokir: blokir
  });
  if (error) return alert(error.message);
  await muat();
}

app.onclick = async (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.filter) { filter = b.dataset.filter; return render(); }
  if (b.id === 'bPulih') return pulihkan();
  if (b.id === 'keluar') {
    await db.auth.signOut();
    return location.replace('/masuk');
  }
  if (b.dataset.aksi) {
    const t = semua.find(x => x.id === b.dataset.id);
    const a = b.dataset.aksi;
    if (a === 'unduh' && t) return unduhData(t);
    if (a === 'hapus' && t) return hapusToko(t);
    if (a === 'permanen' && t) return hapusPermanen(t);
    return aksi(b.dataset.id, a);
  }
};

(async () => {
  const { data: s } = await db.auth.getSession();
  if (!s.session) return location.replace('/masuk?next=' + encodeURIComponent('/admin'));
  const { data: p } = await db.from('profiles').select('peran').eq('id', s.session.user.id).single();
  if (!p || p.peran !== 'admin') return tolakAkses(s.session.user.email);
  await muat();
})();
</script>
</body>
</html>
