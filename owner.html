<html lang="id">
<head>
<meta charset="utf-8">

<meta name="robots" content="noindex">
<title>Owner | DearLoyal</title>

<body>
<div id="app"><div class="tengah"><div class="panel pusat">Memuat...</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const el = id => document.getElementById(id);
const app = el('app');
let toko = null, diblokir = false, halaman = 1, kata = '', timer = null;

function linkWa(n) {
  let d = String(n || '').replace(/[^0-9]/g, '');
  if (d.startsWith('0')) d = '62' + d.slice(1);
  return d ? 'https://wa.me/' + d : '';
}
function slugify(s) {
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 30).replace(/-+$/, '');
}
function tanggal(s) {
  return s ? new Date(s).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) : '-';
}
function fmtId(i) { return i.slice(0, 4) + ' ' + i.slice(4); }
function kepala(sub) {
  return '<div class="atas"><div><h1 class="merek">DearLoyal</h1><div class="redup">' + sub +
    '</div></div><button type="button" id="keluar" class="tombol putih kecil">Keluar</button></div>';
}
function pesan(teks, jenis) {
  const p = el('pesan');
  if (!p) return;
  p.textContent = teks;
  p.className = 'pesan tampil ' + jenis;
}

/* ---------- tampilan status ---------- */
function tampilBlokir() {
  app.innerHTML = '<div class="hal">' + kepala('Owner') +
    '<div class="panel pusat" style="max-width:none"><div class="ikon-besar">🚫</div>' +
    '<h2 style="margin:0 0 6px">Tidak bisa mendaftar toko</h2>' +
    '<p class="sub">Akun ini tidak dapat mendaftarkan toko.</p></div></div>';
}

function tampilMenunggu() {
  app.innerHTML = '<div class="hal">' + kepala('Owner') +
    '<div class="panel pusat" style="max-width:none"><div class="ikon-besar">⏳</div>' +
    '<h2 style="margin:0 0 6px">Pendaftaran sedang ditinjau</h2>' +
    '<p class="sub">Toko <strong>' + esc(toko.nama) + '</strong> sudah terkirim. ' +
    'Admin akan menghubungi kamu lewat WhatsApp ke ' + esc(toko.whatsapp) + '.</p></div></div>';
}

function tampilDitolak() {
  const wa = linkWa(DL.ADMIN_WA);
  app.innerHTML = '<div class="hal">' + kepala('Owner') +
    '<div class="panel pusat" style="max-width:none"><div class="ikon-besar">✋</div>' +
    '<h2 style="margin:0 0 6px">Pendaftaran belum disetujui</h2>' +
    (toko.alasan_tolak ? '<p class="sub">Alasan: ' + esc(toko.alasan_tolak) + '</p>' : '') +
    '<div class="aksi">' +
    (wa ? '<a class="tombol putih" href="' + wa + '" target="_blank" rel="noopener">Hubungi admin lewat WhatsApp</a>' : '') +
    (diblokir ? '' : '<button type="button" id="ajukanUlang" class="tombol">Ajukan ulang</button>') +
    '</div></div></div>';
}

/* ---------- form daftar ---------- */
function tampilForm(awal) {
  if (diblokir) return tampilBlokir();
  const t = awal || {};
  const jenis = ['Kafe', 'Restoran', 'Laundry', 'Barbershop', 'Salon', 'Toko', 'Lainnya'];
  app.innerHTML = '<div class="hal">' + kepala('Daftar toko') +
    '<div class="panel" style="max-width:none">' +
    '<h2 style="margin:0 0 4px">Daftarkan toko kamu</h2>' +
    '<p class="sub">Setelah dikirim, admin akan meninjau dan menghubungi kamu lewat WhatsApp.</p>' +
    '<form id="fToko" novalidate>' +
    '<div class="baris"><label for="nama">Nama toko</label>' +
      '<input id="nama" maxlength="60" value="' + esc(t.nama || '') + '"></div>' +
    '<div class="baris"><label for="slug">Link toko</label>' +
      '<input id="slug" maxlength="30" autocapitalize="none" value="' + esc(t.slug || '') + '">' +
      '<div class="redup" id="hintLink" style="margin-top:6px"></div></div>' +
    '<div class="baris"><label for="jenis">Jenis usaha</label><select id="jenis">' +
      jenis.map(j => '<option' + (t.jenis_usaha === j ? ' selected' : '') + '>' + j + '</option>').join('') +
      '</select></div>' +
    '<div class="baris"><label for="kota">Kota</label>' +
      '<input id="kota" maxlength="40" value="' + esc(t.kota || '') + '"></div>' +
    '<div class="baris"><label for="wa">Nomor WhatsApp</label>' +
      '<input id="wa" type="tel" inputmode="tel" placeholder="08xxxxxxxxxx" value="' + esc(t.whatsapp || '') + '"></div>' +
    '<label class="cek"><input type="checkbox" id="setuju"> <span>Saya menyetujui Syarat dan Kebijakan Privasi DearLoyal.</span></label>' +
    '<button type="submit" id="bKirim" class="tombol" style="margin-top:16px">Kirim pendaftaran</button>' +
    '</form><div id="pesan" class="pesan"></div></div></div>';

  let sentuh = !!t.slug;
  const hint = () => { el('hintLink').textContent = location.host + '/t/' + (el('slug').value || '...'); };
  el('nama').oninput = () => { if (!sentuh) el('slug').value = slugify(el('nama').value); hint(); };
  el('slug').oninput = () => {
    sentuh = true;
    el('slug').value = el('slug').value.toLowerCase().replace(/[^a-z0-9-]/g, '');
    hint();
  };
  hint();

  el('fToko').onsubmit = async (e) => {
    e.preventDefault();
    if (!el('setuju').checked) return pesan('Centang persetujuan dulu.', 'galat');
    const b = el('bKirim');
    b.disabled = true;
    const { error } = await db.rpc('daftar_toko', {
      p_nama: el('nama').value, p_slug: el('slug').value,
      p_jenis_usaha: el('jenis').value, p_kota: el('kota').value, p_whatsapp: el('wa').value
    });
    if (error) { b.disabled = false; return pesan(error.message, 'galat'); }
    muat();
  };
}

/* ---------- dashboard ---------- */
function tampilDash() {
  const w = warnaAman(toko.warna);
  const link = location.origin + '/t/' + toko.slug;
  const wa = linkWa(DL.ADMIN_WA);
  halaman = 1; kata = '';

  app.innerHTML = '<div class="hal lebar">' + kepala('Dashboard owner') +
    (toko.status === 'nonaktif'
      ? '<div class="pesan galat tampil" style="margin:0 0 16px">Toko kamu dinonaktifkan sementara oleh admin.' +
        (wa ? ' <a href="' + wa + '" target="_blank" rel="noopener">Hubungi admin</a>' : '') + '</div>' : '') +
    '<div class="atas"><div><h2 style="margin:0">' + esc(toko.nama) + '</h2>' +
      '<div class="redup">' + esc(link) + '</div></div>' +
      (toko.status === 'aktif'
        ? '<button type="button" id="bKasir" class="tombol kecil" style="background:' + w + '">Buka mode kasir</button>' : '') +
    '</div>' +
    '<div id="ring" class="angka"></div>' +
    '<div class="sec"><h3>QR toko</h3><div class="qr-toko" id="qrToko"></div>' +
      '<div class="redup" style="margin-top:8px">Cetak dan tempel di kasir. Pembeli scan untuk bergabung.</div>' +
      '<div class="baris-aksi"><button type="button" id="salinLink" class="tombol putih kecil">Salin link</button>' +
      '<button type="button" id="simpanQr" class="tombol putih kecil">Simpan QR sebagai gambar</button></div></div>' +
      '<div class="sec"><h3>Logo toko</h3>' +
      '<div id="logoBox" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"></div>' +
      '<input id="fileLogo" type="file" accept="image/png,image/jpeg,image/webp" style="display:none">' +
      '<div class="baris-aksi"><button type="button" id="bPilihLogo" class="tombol putih kecil">Pilih logo</button>' +
      '<button type="button" id="bHapusLogo" class="tombol merah kecil">Hapus logo</button></div>' +
      '<div class="redup" style="margin-top:8px">Gambar otomatis dikecilkan. Logo tampil di kartu pembeli dan halaman toko.</div>' +
      '<div id="pesanLogo" class="pesan"></div></div>' +
      '<div class="sec"><h3>Pengaturan toko</h3>' +
      '<div class="pratinjau" id="pratinjau"></div>' +
      '<form id="fSet" novalidate>' +
      '<div class="baris"><label>Warna kartu</label><div class="warna-pilih" id="swatch"></div></div>' +
      '<div class="dua">' +
        '<div class="baris"><label for="sIkon">Ikon stempel</label><select id="sIkon">' +
          Object.keys(IKON).map(k => '<option value="' + k + '">' + IKON[k] + ' ' + k + '</option>').join('') + '</select></div>' +
        '<div class="baris"><label for="sJumlah">Jumlah stempel</label><select id="sJumlah">' +
          [6, 8, 10, 12].map(n => '<option value="' + n + '">' + n + '</option>').join('') + '</select></div>' +
      '</div>' +
      '<div class="baris"><label for="sHadiah">Hadiah</label><input id="sHadiah" maxlength="80"></div>' +
      '<div class="baris"><label for="sSyarat">Syarat hadiah (opsional)</label><textarea id="sSyarat" rows="2" maxlength="300"></textarea></div>' +
      '<div class="baris"><label for="sIg">Instagram (opsional, tanpa @)</label><input id="sIg" maxlength="30" autocapitalize="none"></div>' +
      '<div class="baris"><label for="sJeda">Jeda antar stempel</label><select id="sJeda">' +
        [[0, 'Tanpa jeda'], [5, '5 menit'], [10, '10 menit'], [30, '30 menit'], [60, '1 jam'], [240, '4 jam'], [1440, '1 hari']]
          .map(j => '<option value="' + j[0] + '">' + j[1] + '</option>').join('') + '</select></div>' +
      '<button type="submit" class="tombol kecil" style="width:auto">Simpan pengaturan</button></form>' +
      '<div id="pesanSet" class="pesan"></div></div>' +
    '<div class="sec"><h3>PIN kasir</h3>' +
      '<form id="fPin" novalidate><div class="baris"><label for="pinBaru">PIN baru (6 digit angka)</label>' +
      '<input id="pinBaru" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></div>' +
      '<button type="submit" class="tombol kecil" style="width:auto">Simpan PIN</button></form>' +
      '<div id="pesanPin" class="pesan"></div></div>' +
    '<div class="sec"><h3>Member</h3>' +
      '<input id="cariMember" type="text" placeholder="Cari nama, username, atau ID" autocomplete="off">' +
      '<div id="listMember" style="margin-top:8px">Memuat...</div></div></div>';

  const m = matriksQr(link);
  el('qrToko').innerHTML = svgQr(m);
  el('simpanQr').onclick = () => unduhQr(m, 'qr-toko-' + toko.slug + '.png');
  el('salinLink').onclick = async () => {
    try { await navigator.clipboard.writeText(link); el('salinLink').textContent = 'Link tersalin ✓'; }
    catch (e) { prompt('Salin link ini:', link); }
  };
  el('cariMember').oninput = () => {
    clearTimeout(timer);
    timer = setTimeout(() => { kata = el('cariMember').value.trim(); halaman = 1; muatMember(); }, 350);
  };
  el('fPin').onsubmit = async (e) => {
    e.preventDefault();
    const pin = el('pinBaru').value.trim();
    const p = el('pesanPin');
    if (!/^[0-9]{6}$/.test(pin)) { p.textContent = 'PIN harus 6 digit angka.'; p.className = 'pesan tampil galat'; return; }
    const { error } = await db.rpc('atur_pin_kasir', { p_toko_id: toko.id, p_pin: pin });
    if (error) { p.textContent = error.message; p.className = 'pesan tampil galat'; return; }
    el('pinBaru').value = '';
    p.textContent = 'PIN kasir disimpan. Kasir yang sedang masuk akan keluar otomatis.';
    p.className = 'pesan tampil ok';
  };

  pasangPengaturan();
  pasangLogo();
  muatRingkasan();
  muatMember();
}

async function muatRingkasan() {
  const { data, error } = await db.rpc('owner_ringkasan', { p_toko_id: toko.id });
  if (error) return el('ring').innerHTML = '<div class="redup">Gagal memuat ringkasan.</div>';
  const item = [['jumlah_member', 'Member'], ['stempel_hari_ini', 'Stempel hari ini'],
                ['stempel_bulan_ini', 'Stempel bulan ini'], ['hadiah_diklaim', 'Hadiah diklaim']];
  el('ring').innerHTML = item.map(([k, l]) =>
    '<div class="ang"><b>' + Number(data[k]).toLocaleString('id-ID') + '</b><span>' + l + '</span></div>').join('');
}

async function muatMember() {
  const { data, error } = await db.rpc('owner_daftar_member',
    { p_toko_id: toko.id, p_cari: kata, p_halaman: halaman });
  const box = el('listMember');
  if (error) return box.innerHTML = '<div class="redup">Gagal memuat: ' + esc(error.message) + '</div>';
  if (!data.member.length) {
    return box.innerHTML = '<div class="redup" style="padding:12px 0">' +
      (kata ? 'Tidak ada member yang cocok.' : 'Belum ada member.') + '</div>';
  }
  const maks = Math.max(1, Math.ceil(data.total / data.per_halaman));
  box.innerHTML = data.member.map(m =>
    '<div class="mem"><div><strong>' + esc(m.nama) + '</strong>' +
    '<div class="redup">@' + esc(m.username) + ' · ID ' + fmtId(m.id_unik) + '</div>' +
    '<div class="redup">Gabung ' + tanggal(m.bergabung) + '</div></div>' +
    '<div style="text-align:right"><strong>' + m.jumlah_stempel + '/' + toko.jumlah_stempel + '</strong>' +
    '<div class="redup">Kartu #' + m.nomor_kartu + '</div></div></div>').join('') +
    '<div class="hal-nav"><button type="button" data-nav="-1" class="tombol putih kecil"' +
      (halaman <= 1 ? ' disabled' : '') + '>Sebelumnya</button>' +
    '<span class="redup">Halaman ' + halaman + ' dari ' + maks + ' · ' + data.total + ' member</span>' +
    '<button type="button" data-nav="1" class="tombol putih kecil"' +
      (halaman >= maks ? ' disabled' : '') + '>Berikutnya</button></div>';
}

const WARNA = ['#2563eb', '#0ea5e9', '#16a34a', '#b45309', '#dc2626', '#db2777', '#7c3aed', '#0f172a'];

function pasangPengaturan() {
  let warna = warnaAman(toko.warna);
  const ikon = el('sIkon'), jumlah = el('sJumlah'), hadiah = el('sHadiah'), jeda = el('sJeda');

  ikon.value = toko.ikon in IKON ? toko.ikon : 'bintang';
  jumlah.value = String(toko.jumlah_stempel);
  hadiah.value = toko.teks_hadiah || '';
  el('sSyarat').value = toko.syarat_hadiah || '';
  el('sIg').value = toko.instagram || '';
  if (![...jeda.options].some(o => Number(o.value) === toko.jeda_menit)) {
    jeda.add(new Option(toko.jeda_menit + ' menit', toko.jeda_menit));
  }
  jeda.value = String(toko.jeda_menit);

  const pilihSw = () => {
    el('swatch').innerHTML = WARNA.map(c =>
      '<button type="button" class="sw' + (c.toLowerCase() === warna.toLowerCase() ? ' pilih' : '') +
      '" data-warna="' + c + '" style="background:' + c + '" aria-label="Warna ' + c + '"></button>').join('');
  };
  const pratinjau = () => {
    const n = Number(jumlah.value);
    const isi = Math.min(3, n);
    el('pratinjau').innerHTML =
      '<div class="kt" style="--w:' + warna + '"><div class="kt-atas"><strong>' + esc(toko.nama) +
      '</strong><span>' + isi + '/' + n + '</span></div>' +
      htmlStempel(isi, n, ikon.value) +
      '<div class="kt-info">Kumpulkan ' + (n - isi) + ' stempel lagi untuk: ' + esc(hadiah.value || '-') + '</div></div>';
  };
  pilihSw(); pratinjau();

  el('swatch').onclick = (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    warna = b.dataset.warna;
    pilihSw(); pratinjau();
  };
  ikon.onchange = pratinjau;
  jumlah.onchange = pratinjau;
  hadiah.oninput = pratinjau;

  el('fSet').onsubmit = async (e) => {
    e.preventDefault();
    const p = el('pesanSet');
    const teks = hadiah.value.trim();
    if (teks.length < 2) {
      p.textContent = 'Isi hadiah minimal 2 huruf.';
      p.className = 'pesan tampil galat';
      return;
    }
    const baruJumlah = Number(jumlah.value);
    if (baruJumlah !== toko.jumlah_stempel &&
        !confirm('Jumlah stempel berubah dan berlaku untuk semua kartu, termasuk yang sedang berjalan. Lanjutkan?')) return;

    const { error } = await db.rpc('ubah_pengaturan_toko', {
      p_toko_id: toko.id,
      p_data: {
        warna: warna, ikon: ikon.value, jumlah_stempel: baruJumlah, teks_hadiah: teks,
        syarat_hadiah: el('sSyarat').value, instagram: el('sIg').value.trim(),
        jeda_menit: Number(jeda.value)
      }
    });
    if (error) {
      p.textContent = error.message;
      p.className = 'pesan tampil galat';
      return;
    }
    toko.warna = warna; toko.ikon = ikon.value; toko.jumlah_stempel = baruJumlah;
    toko.teks_hadiah = teks; toko.syarat_hadiah = el('sSyarat').value;
    toko.instagram = el('sIg').value.trim(); toko.jeda_menit = Number(jeda.value);
    p.textContent = 'Pengaturan disimpan.';
    p.className = 'pesan tampil ok';
    muatMember();
  };
}

function kompresLogo(file) {
  return new Promise((ok, gagal) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 512 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(img.width * s));
      cv.height = Math.max(1, Math.round(img.height * s));
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(b => b ? ok(b) : gagal(new Error('Gagal memproses gambar.')), 'image/webp', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); gagal(new Error('File bukan gambar yang valid.')); };
    img.src = url;
  });
}

async function unggahLogo(file) {
  const blob = await kompresLogo(file);
  if (blob.size > 500000) throw new Error('Gambar masih terlalu besar. Pakai gambar yang lebih sederhana.');
  const ext = blob.type === 'image/webp' ? 'webp' : 'png';
  const path = toko.id + '/logo-' + Date.now() + '.' + ext;
  const { error } = await db.storage.from('logo').upload(path, blob,
    { contentType: blob.type, cacheControl: '31536000' });
  if (error) throw error;
  const { error: e2 } = await db.rpc('ubah_pengaturan_toko',
    { p_toko_id: toko.id, p_data: { logo_path: path } });
  if (e2) throw e2;
  const lama = toko.logo_path;
  toko.logo_path = path;
  if (lama && lama !== path) await db.storage.from('logo').remove([lama]);
}

function pasangLogo() {
  const box = el('logoBox'), p = el('pesanLogo');
  const gambar = () => {
    box.innerHTML = toko.logo_path ? htmlLogo(toko.logo_path, 72, toko.nama)
      : '<div class="redup">Belum ada logo.</div>';
    el('bHapusLogo').style.display = toko.logo_path ? '' : 'none';
  };
  const info = (t, j) => { p.textContent = t; p.className = 'pesan tampil ' + j; };
  gambar();

  el('bPilihLogo').onclick = () => el('fileLogo').click();
  el('fileLogo').onchange = async () => {
    const f = el('fileLogo').files[0];
    el('fileLogo').value = '';
    if (!f) return;
    if (f.size > 8 * 1024 * 1024) return info('File terlalu besar (maksimal 8 MB).', 'galat');
    info('Mengunggah...', 'ok');
    try { await unggahLogo(f); gambar(); info('Logo disimpan.', 'ok'); }
    catch (e) { info(e.message || 'Gagal mengunggah logo.', 'galat'); }
  };
  el('bHapusLogo').onclick = async () => {
    if (!confirm('Hapus logo toko?')) return;
    const lama = toko.logo_path;
    const { error } = await db.rpc('ubah_pengaturan_toko',
      { p_toko_id: toko.id, p_data: { logo_path: null } });
    if (error) return info(error.message, 'galat');
    toko.logo_path = null;
    if (lama) await db.storage.from('logo').remove([lama]);
    gambar();
    info('Logo dihapus.', 'ok');
  };
}

/* ---------- wizard setup ---------- */
let wz = null;

function wizFrame(isi) {
  app.innerHTML = '<div class="hal">' + kepala('Setup toko') +
    '<div class="sec" style="margin-top:0"><div class="redup">Langkah ' + wz.n + ' dari 5</div>' +
    '<div style="height:6px;border-radius:99px;background:#e2e8f0;margin:8px 0 18px">' +
    '<div style="height:100%;width:' + (wz.n * 20) + '%;border-radius:99px;background:var(--utama);transition:width .4s"></div></div>' +
    isi + '<div id="pesan" class="pesan"></div></div></div>';

    '<div class="kt-atas"><strong>' + esc(toko.nama) + '</strong><span>' + isi + '/' + n + '</span></div>' +
    htmlStempel(isi, n, wz.ikon) +
    '<div class="kt-info">Kumpulkan ' + (n - isi) + ' stempel lagi untuk: ' + esc(wz.hadiah || '-') + '</div></div></div>';
}

function tampilWizard() {
  if (!wz) {
    wz = { n: 1, warna: warnaAman(toko.warna), ikon: (toko.ikon in IKON) ? toko.ikon : 'bintang',
           jumlah: toko.jumlah_stempel, hadiah: toko.teks_hadiah };
  }
  [null, wizLogo, wizTampilan, wizAturan, wizPin, wizSelesai][wz.n]();
}

function wizLogo() {
  wizFrame('<h2 style="margin:0 0 4px">Logo toko</h2>' +
    '<p class="sub">Boleh dilewati. Bisa diubah kapan saja di dashboard.</p>' +
    '<div id="logoBox" style="margin-bottom:12px"></div>' +
    '<input id="fileLogo" type="file" accept="image/png,image/jpeg,image/webp" style="display:none">' +
    '<div class="aksi"><button type="button" id="bPilih" class="tombol putih">Pilih logo</button>' +
    '<button type="button" id="bLanjut" class="tombol">Lanjut</button></div>');
  const gambar = () => {
    el('logoBox').innerHTML = toko.logo_path ? htmlLogo(toko.logo_path, 72, toko.nama)
      : '<div class="redup">Belum ada logo.</div>';
  };
  gambar();
  el('bPilih').onclick = () => el('fileLogo').click();
  el('fileLogo').onchange = async () => {
    const f = el('fileLogo').files[0];
    el('fileLogo').value = '';
    if (!f) return;
    if (f.size > 8 * 1024 * 1024) return pesan('File terlalu besar (maksimal 8 MB).', 'galat');
    pesan('Mengunggah...', 'ok');
    try { await unggahLogo(f); gambar(); pesan('Logo disimpan.', 'ok'); }
    catch (e) { pesan(e.message || 'Gagal mengunggah logo.', 'galat'); }
  };
  el('bLanjut').onclick = () => { wz.n = 2; tampilWizard(); };
}

function wizTampilan() {
  wizFrame('<h2 style="margin:0 0 4px">Tampilan kartu</h2>' +
    '<p class="sub">Pilih warna dan ikon stempel.</p><div id="pr"></div>' +
    '<div class="baris"><label>Warna kartu</label><div class="warna-pilih" id="swatch"></div></div>' +
    '<div class="baris"><label for="wIkon">Ikon stempel</label><select id="wIkon">' +
      Object.keys(IKON).map(k => '<option value="' + k + '">' + IKON[k] + ' ' + k + '</option>').join('') +
    '</select></div>' +
    '<div class="aksi"><button type="button" id="bKembali" class="tombol putih">Kembali</button>' +
    '<button type="button" id="bLanjut" class="tombol">Lanjut</button></div>');
  const gambar = () => {
    el('pr').innerHTML = wizKartu(3, wz.jumlah);
    el('swatch').innerHTML = WARNA.map(c =>
      '<button type="button" class="sw' + (c.toLowerCase() === wz.warna.toLowerCase() ? ' pilih' : '') +
      '" data-warna="' + c + '" style="background:' + c + '" aria-label="Warna ' + c + '"></button>').join('');
  };
  el('wIkon').value = wz.ikon;
  gambar();
  el('swatch').onclick = (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    wz.warna = b.dataset.warna;
    gambar();
  };
  el('wIkon').onchange = () => { wz.ikon = el('wIkon').value; gambar(); };
  el('bKembali').onclick = () => { wz.n = 1; tampilWizard(); };
  el('bLanjut').onclick = async () => {
    const { error } = await db.rpc('ubah_pengaturan_toko',
      { p_toko_id: toko.id, p_data: { warna: wz.warna, ikon: wz.ikon } });
    if (error) return pesan(error.message, 'galat');
    toko.warna = wz.warna; toko.ikon = wz.ikon;
    wz.n = 3; tampilWizard();
  };
}

function wizAturan() {
  const contoh = ['Gratis 1 minuman', 'Diskon 20%', 'Gratis 1 item'];
  wizFrame('<h2 style="margin:0 0 4px">Aturan kartu</h2>' +
    '<p class="sub">Berapa stempel yang dikumpulkan, dan apa hadiahnya.</p><div id="pr"></div>' +
    '<div class="baris"><label for="wJumlah">Jumlah stempel</label><select id="wJumlah">' +
      [6, 8, 10, 12].map(n => '<option value="' + n + '">' + n + ' stempel</option>').join('') + '</select></div>' +
    '<div class="baris"><label for="wHadiah">Hadiah</label><input id="wHadiah" maxlength="80"></div>' +
    '<div class="chips">' + contoh.map(c => '<button type="button" class="chip" data-contoh="' + c + '">' + c + '</button>').join('') + '</div>' +
    '<div class="aksi"><button type="button" id="bKembali" class="tombol putih">Kembali</button>' +
    '<button type="button" id="bLanjut" class="tombol">Lanjut</button></div>');
  const gambar = () => { el('pr').innerHTML = wizKartu(Math.min(3, wz.jumlah), wz.jumlah); };
  el('wJumlah').value = String(wz.jumlah);
  el('wHadiah').value = wz.hadiah;
  gambar();
  el('wJumlah').onchange = () => { wz.jumlah = Number(el('wJumlah').value); gambar(); };
  el('wHadiah').oninput = () => { wz.hadiah = el('wHadiah').value; gambar(); };
  document.querySelectorAll('[data-contoh]').forEach(b => {
    b.onclick = () => { wz.hadiah = b.dataset.contoh; el('wHadiah').value = wz.hadiah; gambar(); };
  });
  el('bKembali').onclick = () => { wz.n = 2; tampilWizard(); };
  el('bLanjut').onclick = async () => {
    const teks = el('wHadiah').value.trim();
    if (teks.length < 2) return pesan('Isi hadiah minimal 2 huruf.', 'galat');
    const { error } = await db.rpc('ubah_pengaturan_toko',
      { p_toko_id: toko.id, p_data: { jumlah_stempel: wz.jumlah, teks_hadiah: teks } });
    if (error) return pesan(error.message, 'galat');
    wz.hadiah = teks; toko.jumlah_stempel = wz.jumlah; toko.teks_hadiah = teks;
    wz.n = 4; tampilWizard();
  };
}

function wizPin() {
  wizFrame('<h2 style="margin:0 0 4px">PIN kasir</h2>' +
    '<p class="sub">Kasir memakai PIN ini untuk masuk ke halaman kasir. Berikan hanya ke kasir kamu.</p>' +
    '<div class="baris"><label for="wPin">PIN (6 digit angka)</label>' +
    '<input id="wPin" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></div>' +
    '<div class="aksi"><button type="button" id="bKembali" class="tombol putih">Kembali</button>' +
    '<button type="button" id="bLanjut" class="tombol">Simpan PIN dan lanjut</button></div>');
  el('bKembali').onclick = () => { wz.n = 3; tampilWizard(); };
  el('bLanjut').onclick = async () => {
    const pin = el('wPin').value.trim();
    if (!/^[0-9]{6}$/.test(pin)) return pesan('PIN harus 6 digit angka.', 'galat');
    const { error } = await db.rpc('atur_pin_kasir', { p_toko_id: toko.id, p_pin: pin });
    if (error) return pesan(error.message, 'galat');
    wz.n = 5; tampilWizard();
  };
}

function wizSelesai() {
  const link = location.origin + '/t/' + toko.slug;
  wizFrame('<h2 style="margin:0 0 4px">Toko siap dipakai</h2>' +
    '<p class="sub">Cetak QR ini dan tempel di kasir. Pembeli scan untuk bergabung.</p>' +
    '<div class="qr-toko" id="qrToko"></div><div class="redup" style="margin:8px 0">' + esc(link) + '</div>' +
    '<div class="baris-aksi"><button type="button" id="salinLink" class="tombol putih kecil">Salin link</button>' +
    '<button type="button" id="simpanQr" class="tombol putih kecil">Simpan QR sebagai gambar</button></div>' +
    '<div class="aksi" style="margin-top:16px"><button type="button" id="bKembali" class="tombol putih">Kembali</button>' +
    '<button type="button" id="bSelesai" class="tombol">Selesai, buka dashboard</button></div>');
  const m = matriksQr(link);
  el('qrToko').innerHTML = svgQr(m);
  el('simpanQr').onclick = () => unduhQr(m, 'qr-toko-' + toko.slug + '.png');
  el('salinLink').onclick = async () => {
    try { await navigator.clipboard.writeText(link); el('salinLink').textContent = 'Link tersalin ✓'; }
    catch (e) { prompt('Salin link ini:', link); }
  };
  el('bKembali').onclick = () => { wz.n = 4; tampilWizard(); };
  el('bSelesai').onclick = async () => {
    const { error } = await db.rpc('selesai_setup', { p_toko_id: toko.id });
    if (error) return pesan(error.message, 'galat');
    toko.setup_selesai = true;
    wz = null;
    tampilDash();
  };
}

/* ---------- klik ---------- */
app.onclick = async (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.id === 'keluar') { await db.auth.signOut(); return location.replace('/masuk'); }
  if (b.id === 'ajukanUlang') return tampilForm(toko);
  if (b.dataset.nav) { halaman += Number(b.dataset.nav); return muatMember(); }
  if (b.id === 'bKasir') {
    const { data, error } = await db.rpc('owner_token_kasir', { p_toko_id: toko.id });
    if (error) return alert(error.message);
    try {
      localStorage.setItem('dl_kasir_' + toko.slug,
        JSON.stringify({ token: data.token, exp: Date.now() + 11.5 * 3600 * 1000 }));
    } catch (x) {}
    location.href = '/t/' + toko.slug + '/kasir';
  }
};

/* ---------- mulai ---------- */
async function muat() {
  const { data: s } = await db.auth.getSession();
  if (!s.session) return location.replace('/masuk?next=' + encodeURIComponent('/owner'));
  const { data: p } = await db.from('profiles').select('diblokir_toko').eq('id', s.session.user.id).single();
  diblokir = !!(p && p.diblokir_toko);
  const { data, error } = await db.rpc('toko_saya');
  if (error) {
    app.innerHTML = '<div class="tengah"><div class="panel pusat"><p class="sub">Gagal memuat: ' +
      esc(error.message) + '</p></div></div>';
    return;
  }
  toko = (data && data[0]) || null;
  if (!toko) return tampilForm();
  if (toko.status === 'menunggu') return tampilMenunggu();
  if (toko.status === 'ditolak') return tampilDitolak();
  if (toko.status === 'aktif' && !toko.setup_selesai) return tampilWizard();
  tampilDash();
}
muat();
</script>
